# Builds both static apps and publishes them to GitHub Pages:
#   /            -> the image classifier trainer (repo root)
#   /smart-vision-trainer/ -> the Smart Vision Trainer
# Both use `base: './'`, so they work under the /tm-clone/ project-site path.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build classifier trainer
        run: npm ci && npm run build
      - name: Build Smart Vision Trainer
        run: npm ci && npm run build
        working-directory: smart-vision-trainer
      - name: Combine outputs
        run: cp -r smart-vision-trainer/dist dist/smart-vision-trainer
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
